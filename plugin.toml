schema_version = 1

[plugin]
id          = "transmission"
name        = "Transmission"
version     = "0.1.0"
description = "Downloads the torrents everything else asks for"
without_it  = "No torrent downloads"
upstream    = "https://github.com/transmission/transmission"
license     = "GPL-2.0-only OR GPL-3.0-only"
forms       = ["dl", "hunt", "tv", "movies", "music", "books", "auto", "full"]

[[service]]
id          = "transmission"
name        = "Transmission"
image       = "lscr.io/linuxserver/transmission"
digest      = "sha256:aaf349cd859ca9d5f34f394c56b8097c267a513283698adc4d07ee61d7cb1a85"
tag         = "4.1.4-r0-ls369"
port        = 9091
bind        = "loopback"
listens     = 9091
health      = { kind = "http", path = "/transmission/web/", timeout_s = 60 }
criticality = "core"
memory_mib  = 200
reaches     = "trackers and peers, through the tunnel"
asks_for    = "Announces to a torrent's trackers and exchanges data with peers, which is what a torrent client is; all of it inside gluetun's network, so it stops when the tunnel does."
takes_data  = true
user_mode   = "puid-env"
network     = { via = "network.egress-guard" }

[service.env]
USER = { secret = "upstream-username" }
PASS = { secret = "upstream-password" }

[[secret]]
id     = "upstream-username"
of     = "transmission"
minted = true
why    = "The name of the RPC account the adapter in front of Transmission signs in as"

[[secret]]
id     = "upstream-password"
of     = "transmission"
minted = true
why    = "The password of that account, which Transmission keeps only as a salted hash"

[[ask]]
service    = "transmission"
capability = "dashboard.show"
